name: 🐛 Rapport d'anomalie / Bug Report
description: Signaler un dysfonctionnement ou un bogue dans GestUniv
title: "[BUG] : "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème afin d'améliorer GestUniv !
  - type: textarea
    id: description
    attributes:
      label: Description du bogue
      description: Expliquez clairement ce qui ne fonctionne pas.
      placeholder: Lorsque je clique sur ..., une erreur s'affiche...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Détaillez les étapes précises pour reproduire le comportement.
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui aurait dû se produire normalement.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement serveur
      options:
        - XAMPP (Windows)
        - WampServer (Windows)
        - Laragon (Windows)
        - Docker / Linux LAMP
        - Autre
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: Version de PHP
      placeholder: "ex: 8.2.12"
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai vérifié que la base de données MySQL est active et que `schema.sql` est appliqué.
          required: true
        - label: Ce problème n'a pas déjà été signalé dans les tickets ouverts.
          required: false
